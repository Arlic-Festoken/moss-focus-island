name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate version tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v1.2.0" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          source_version="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          if [[ "$source_version" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $source_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run checks
        run: ./scripts/verify-all.sh

      - name: Build universal macOS app
        env:
          MOSS_ARCHS: arm64 x86_64
          MOSS_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-app.sh

      - name: Verify application bundle
        run: |
          codesign --verify --deep --strict dist/Moss.app
          test "$(defaults read "$PWD/dist/Moss.app/Contents/Info" CFBundleShortVersionString)" = "${GITHUB_REF_NAME#v}"
          lipo dist/Moss.app/Contents/MacOS/Moss -verify_arch arm64 x86_64

      - name: Package downloads
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Moss.app "release/Moss-${version}-macOS-universal.zip"
          mkdir -p release/dmg
          ditto dist/Moss.app release/dmg/Moss.app
          ln -s /Applications release/dmg/Applications
          hdiutil create \
            -volname "Moss ${version}" \
            -srcfolder release/dmg \
            -ov -format UDZO \
            "release/Moss-${version}-macOS-universal.dmg"
          rm -rf release/dmg
          (
            cd release
            shasum -a 256 \
              "Moss-${version}-macOS-universal.zip" \
              "Moss-${version}-macOS-universal.dmg" \
              > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/Moss-*-macOS-universal.zip \
            release/Moss-*-macOS-universal.dmg \
            release/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Moss ${{ steps.version.outputs.version }}"
