name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run checks
        run: ./scripts/verify-all.sh

      - name: Build universal macOS app
        env:
          MOSS_ARCHS: arm64 x86_64
        run: ./scripts/build-app.sh

      - name: Verify application bundle
        run: |
          codesign --verify --deep --strict dist/Moss.app
          file dist/Moss.app/Contents/MacOS/Moss
          lipo dist/Moss.app/Contents/MacOS/Moss -verify_arch arm64 x86_64
